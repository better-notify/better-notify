name: Renovate
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          private-key: ${{ secrets.BETTER_NOTIFY_APP_PRIVATE_KEY }}
          app-id: ${{ secrets.BETTER_NOTIFY_APP_ID }}
          owner: ${{ github.repository_owner }}
          repositories: 'better-notify'

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Renovate
        uses: renovatebot/github-action@79dc0ba74dc3de28db0a7aeb1d0b95d5bf5fde2a # v46.1.8
        with:
          token: '${{ steps.get_token.outputs.token }}'
          configurationFile: ./.github/renovate-config.js
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL|NODE_OPTIONS)$"
        env:
          NODE_OPTIONS: '--max_old_space_size=6500'
          LOG_LEVEL: 'debug'
