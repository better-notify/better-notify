name: Feature Request
description: Suggest a new feature or improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.

  - type: input
    id: package
    attributes:
      label: Package
      description: Which package does this apply to? Leave blank if it's a new package or general.
      placeholder: '@betternotify/core'
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: A clear description of the feature and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: If you have an idea for the API, show what it would look like.
      render: typescript
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
